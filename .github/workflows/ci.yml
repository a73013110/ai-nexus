name: CI

# Manual only for now: pull requests are verified locally (see docs/development/DEVELOPMENT.md).
# Runs exactly what a contributor runs, so CI and local verification cannot drift apart.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  verify:
    # Production runs on Windows/IIS (DPAPI, Negotiate, Windows paths), so verification runs there.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore
        run: ./scripts/Restore.ps1
      - name: Verify
        run: ./scripts/Verify.ps1
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7
