name: CI

# Manual only for now: pull requests are verified locally (see docs/DEVELOPMENT.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  backend:
    # Production runs on Windows/IIS (DPAPI, Negotiate, Windows paths), so the backend is verified there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/AiNexus.slnx --locked-mode
      - name: Build
        run: dotnet build backend/AiNexus.slnx --no-restore -c Release
      - name: Verify EF model matches migrations
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project backend/src/AiNexus.Features --startup-project backend/src/AiNexus.Api
      - name: Test
        run: dotnet test --solution backend/AiNexus.slnx --no-build -c Release --filter "Category!=Performance&Category!=Browser" --report-xunit-trx --results-directory artifacts/test-results
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/test-results
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
