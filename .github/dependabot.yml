# One grouped pull request per ecosystem each month keeps update noise low for a single maintainer.
# Security updates, when enabled in the repository settings, do not follow this schedule.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend
    schedule: { interval: monthly }
    groups:
      nuget: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
    # Angular pins the supported TypeScript range; upgrade TypeScript together with Angular instead.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      github-actions: { patterns: ["*"] }
