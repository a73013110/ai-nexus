<div class="topbar-left">
  <nx-workspace-menu-button />
  <div class="conversation-heading" data-morph="conversation-title">
    @if (store.selected(); as conversation) {
      <nx-inline-title
        [value]="conversation.title"
        [scope]="conversation.id"
        [save]="rename"
        [disabled]="store.loadingConversation()"
        [editButton]="!compact()"
      />
    } @else {
      <h1>新對話</h1>
    }
  </div>
  @if (store.selected()?.isArchived) {
    <span class="archive-badge">已封存</span>
  }
  @if (!compact() && store.selected()?.projectId; as projectId) {
    <a
      class="project-chat-link"
      [routerLink]="['/projects', projectId]"
      title="檢視專案指示與參考文件"
      ><nx-icon name="archive" />專案</a
    >
  }
</div>
<div class="topbar-actions" #actions>
  @if (store.selected(); as conversation) {
    <!-- Phones fold the cost, find, favourite and rename into the conversation menu. -->
    <nx-conversation-spend
      #spend
      [class.in-menu]="compact()"
      [id]="conversation.id"
      [revision]="conversation.updatedAt + (store.liveRun()?.status ?? '')"
      [anchor]="compact() ? actions : null"
    />
    @if (store.hasSharing() && !compact()) {
      <button
        class="icon-button"
        aria-label="分享此對話"
        title="建立具名唯讀分享"
        [disabled]="store.busy()"
        (click)="action.emit('share')"
      >
        <nx-icon name="share" />
      </button>
    }
    <nx-conversation-actions
      [conversation]="conversation"
      [busy]="store.busy()"
      [sharing]="store.hasSharing()"
      [compact]="compact()"
      [spend]="spend.menuLabel()"
      (action)="choose($event, spend)"
    />
  }
  <!-- Every page keeps its tour at the far right of its header. -->
  <nx-product-tour-button [tour]="tour()" [compact]="true" />
</div>
