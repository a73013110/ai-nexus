<a class="skip-link" href="#composer">跳至訊息輸入</a>
<ng-template nxSidebarPanel>
  <nx-chat-sidebar
    (navigate)="layout.closeMobile()"
    (action)="conversationAction($event.action, $event.conversation)"
    (prompts)="library().open()"
    (commands)="palette.open()"
  />
</ng-template>
<main
  class="main-workspace ui-density-compact"
  [class.chat-starting]="store.starting()"
  id="main"
  [nxFileDrop]="store.canUpload()"
  (filesDropped)="store.attachments.upload($event)"
>
  <header nxChatTopbar class="topbar" [tour]="tour()" (action)="action($event)"></header>
  @if (findOpen()) {
    <nx-conversation-find
      [messages]="store.visibleMessages()"
      (found)="find($event)"
      (closed)="closeFind()"
    />
  }
  @if (store.error(); as error) {
    <nx-notice [message]="error">
      @if (!store.ready()) {
        <button notice-actions (click)="reload()" [disabled]="store.loading()">重新連線</button>
      } @else if (store.pendingSubmission()) {
        <button notice-actions (click)="store.retrySubmission()" [disabled]="store.submitting()">
          重試提交
        </button>
      } @else if (store.connection() === 'disconnected') {
        <button notice-actions (click)="store.resume()">恢復連線</button>
      } @else {
        <button
          notice-actions
          class="icon-button"
          aria-label="關閉錯誤提示"
          (click)="store.error.set(null)"
        >
          <nx-icon name="close" />
        </button>
      }
    </nx-notice>
  }
  <div class="chat-surface">
    <div
      nxChatThread
      class="conversation-body"
      [matches]="matches()"
      [currentMatch]="currentMatch()"
      [arrival]="arrival()"
      [restoreTo]="restoreTo()"
      (edited)="composer().focus()"
    ></div>
    <div nxChatComposer class="composer-region" (sent)="thread().follow()"></div>
  </div>
</main>
<nx-prompt-library [draft]="store.draft().text" (used)="composer().use($event)" />
<nx-conversation-settings [save]="saveSettings" [assignProject]="assignProject" />
<nx-conversation-dialog />
@if (store.hasSharing() && (shareTarget() || store.selected()); as selected) {
  <nx-share-dialog kind="conversation" [sourceId]="selected.id" [name]="selected.title" />
}
