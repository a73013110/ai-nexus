<nx-feature-page [title]="session.featureName('dashboard')" [description]="summary()">
  <div page-actions class="page-actions">
    @if (session.has('admin')) {
      <nx-select
        label="總覽範圍"
        [value]="store.scope()"
        [options]="scopes"
        (valueChange)="store.setScope($event)"
      />
    }
    <button
      type="button"
      class="secondary-button"
      [attr.aria-pressed]="layout.editing()"
      [disabled]="!store.data()"
      (click)="layout.editing.set(!layout.editing())"
    >
      <nx-icon name="layout" />{{ layout.editing() ? '完成' : '自訂版面' }}
    </button>
    <button
      type="button"
      class="icon-button"
      aria-label="重新整理總覽"
      title="重新整理總覽"
      [disabled]="store.refreshing()"
      (click)="store.load()"
    >
      <nx-icon name="refresh" />
    </button>
  </div>
  <nx-dashboard-toolbar />
  @if (store.error()) {
    <nx-notice [message]="store.error()"
      ><button notice-actions type="button" (click)="store.load()">重試</button>
    </nx-notice>
  }
  @if (store.loading() && !store.data()) {
    <div class="dashboard-skeleton" aria-label="正在載入總覽" role="status">
      <div class="skeleton is-wide"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  }
  @if (store.data()) {
    <div
      class="dashboard"
      [attr.aria-busy]="store.refreshing()"
      [class.is-refreshing]="store.refreshing()"
    >
      @if (layout.editing()) {
        <nx-dashboard-edit-bar />
      }
      <nx-dashboard-board />
    </div>
  }
</nx-feature-page>
