<div class="settings-layout ui-density-compact">
  <aside class="settings-sidebar" aria-label="設定分類">
    <span class="settings-title" aria-hidden="true">設定</span>
    <nx-search-field
      label="搜尋設定"
      placeholder="搜尋設定"
      [value]="search()"
      (valueChange)="searchChanged($event)"
    />
    <nav class="settings-categories" aria-label="設定分類">
      @for (tab of visibleTabs(); track tab.id) {
        <button
          type="button"
          [attr.aria-current]="tab.id === current().id ? 'page' : null"
          (click)="tabId.set(tab.id)"
        >
          <nx-icon [name]="tab.icon" />{{ tab.name }}
        </button>
      } @empty {
        <p class="form-note">沒有符合的設定</p>
      }
    </nav>
  </aside>
  <section class="settings-main" aria-labelledby="settings-heading">
    <header class="settings-page-header">
      <h1 id="settings-heading">{{ current().name }}</h1>
      <p>{{ current().description }}</p>
    </header>
    <div class="settings-body">
      <div
        class="settings-content"
        [class.is-refreshing]="current().saved && store.refreshing() && !store.loading()"
        [attr.aria-busy]="(current().saved && store.refreshing()) || null"
        [nxViewMotion]="current().id"
      >
        @if (showSaveBar() && store.error()) {
          <nx-notice [message]="store.error()"
            ><button
              nxPending
              type="button"
              notice-actions
              [pending]="store.refreshing()"
              (click)="store.reload()"
            >
              {{ store.refreshing() ? '重新載入中…' : '重新載入' }}
            </button>
          </nx-notice>
        }
        @if (current().saved && store.loading()) {
          <div class="settings-skeleton" role="status">
            @for (row of skeleton; track $index) {
              <span class="skeleton is-label" [style.width.%]="row"></span>
              <span class="skeleton"></span>
            }
            <span class="sr-only">正在載入你的設定…</span>
          </div>
        } @else {
          <ng-container *ngComponentOutlet="current().component" />
        }
      </div>
    </div>
    @if (showSaveBar()) {
      <form class="settings-savebar" (submit)="save($event)">
        <nx-dialog-save-bar
          label="儲存變更"
          [dirty]="store.changed()"
          [saving]="store.saving()"
          [note]="note()"
          (revert)="revert()"
        />
      </form>
    }
  </section>
  <div class="settings-tools">
    <nx-product-tour-button [tour]="tour()" [compact]="true" />
    <button class="icon-button" aria-label="關閉設定" type="button" (click)="close()">
      <nx-icon name="close" />
    </button>
  </div>
</div>
