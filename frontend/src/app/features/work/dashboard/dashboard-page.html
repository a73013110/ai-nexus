<nx-feature-page [title]="session.featureName('dashboard')" [description]="summary()" [tour]="tour">
  <div page-actions class="page-actions">
    @if (session.has('operations.usage')) {
      <nx-select
        class="dashboard-scope"
        label="總覽範圍"
        [value]="store.scope()"
        [options]="scopes"
        (valueChange)="store.setScope($event)"
      />
    }
    <button
      type="button"
      class="secondary-button dashboard-customize"
      [attr.aria-pressed]="layout.editing()"
      [disabled]="!store.data()"
      (click)="layout.editing.set(!layout.editing())"
    >
      <nx-icon name="layout" />{{ layout.editing() ? '完成' : '自訂版面' }}
    </button>
    <button
      class="dashboard-refresh"
      nxRefresh
      aria-label="重新整理總覽"
      [busy]="store.refreshing()"
      (refresh)="store.load()"
    ></button>
  </div>
  <nx-dashboard-toolbar />
  @if (store.error()) {
    <nx-notice [message]="store.error()"
      ><button
        notice-actions
        nxPending
        type="button"
        [pending]="store.refreshing()"
        (click)="store.load()"
      >
        {{ store.refreshing() ? '重試中…' : '重試' }}
      </button>
    </nx-notice>
  }
  @if (store.loading() && !store.data()) {
    <div class="dashboard-skeleton" role="status">
      <span class="sr-only">正在載入總覽…</span>
      <div class="skeleton is-wide"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
  }
  @if (store.data()) {
    <!-- 重讀的淡化在各磚塊（圖表與表格自己處理），這裡只宣告整區忙碌；輪詢不算重讀。 -->
    <div class="dashboard" [attr.aria-busy]="store.refreshing() || null">
      @if (layout.editing()) {
        <nx-dashboard-edit-bar />
      }
      <nx-dashboard-board />
    </div>
  }
</nx-feature-page>
