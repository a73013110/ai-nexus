<dialog
  nxCompactDialog
  size="lg"
  #dialog
  class="platform-dialog admin-inspector"
  [class.inspector-wide]="store.tab() === 'conversations'"
  [nxDialogView]="store.tab()"
  (cancel)="cancel($event)"
  (close)="closing()"
>
  @let user = store.current();
  <nx-dialog-header
    [heading]="user?.displayName ?? ''"
    [detail]="user?.account ?? ''"
    closeLabel="關閉使用者管理"
  >
    @if (user) {
      <nx-access-status dialog-title [enabled]="user.enabled !== false" />
    }
    @if (user && session.has('audit')) {
      <a
        class="quiet-button inspector-audit"
        routerLink="/admin/audit"
        aria-label="查閱活動稽核"
        title="查閱活動稽核"
        [queryParams]="{ search: user.id }"
        (click)="close()"
      >
        <nx-icon name="audit" /><span>查閱活動稽核</span>
      </a>
    }
  </nx-dialog-header>
  <nx-admin-user-summary />
  <!-- 頁籤固定在面板上方；每個設定頁籤是各自儲存的表單，面板含自己的頁尾。 -->
  <nx-tabs
    #sections
    label="使用者管理分類"
    [items]="tabs"
    [value]="store.tab()"
    (valueChange)="selectTab($event)"
  />
  @let tab = store.tab();
  <div
    class="inspector-panel"
    role="tabpanel"
    [id]="sections.panelId(tab)"
    [attr.aria-labelledby]="sections.tabId(tab)"
    [nxViewMotion]="tab"
  >
    @if (tab === 'conversations') {
      <nx-admin-user-conversations />
    } @else {
      <nx-admin-user-settings [tab]="tab" />
    }
  </div>
</dialog>
<nx-confirm-dialog />
