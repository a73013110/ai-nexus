<dialog
  #dialog
  class="lock-dialog"
  aria-labelledby="lock-title"
  autofocus
  tabindex="-1"
  (cancel)="$event.preventDefault()"
  (keydown)="contain($event)"
>
  <div class="lock-ground"></div>
  <div class="lock-stage">
    <div
      #wrap
      class="lock-wrap"
      [class.shake-a]="rejections() % 2 === 1"
      [class.shake-b]="rejections() > 0 && rejections() % 2 === 0"
    >
      <div #surface class="lock-surface"></div>
      <div class="lock-pill" aria-hidden="true">
        <svg class="lock-glyph" viewBox="0 0 24 24">
          <circle cx="12" cy="16" r="1" />
          <rect x="3" y="10" width="18" height="12" rx="2" />
          <path class="lock-shackle" d="M7 10V7a5 5 0 0 1 9.33-2.5" />
        </svg>
        已解鎖
      </div>
      <div class="lock-card">
        <header class="lock-head">
          <span class="lock-avatar" aria-hidden="true">
            {{ initial(name()) }}
            <span class="lock-badge"><nx-icon name="lock" /></span>
          </span>
          <h2 id="lock-title">工作區已鎖定</h2>
          <p class="lock-who">
            <b>{{ name() }}</b
            ><span>{{ auth.session()?.account }}</span>
          </p>
        </header>
        <form novalidate (submit)="submit($event)">
          <div class="lock-field">
            <label for="lock-password">{{ passwordLabel() }}</label>
            <nx-password-field #field [disabled]="submitting()">
              <input
                #input
                id="lock-password"
                nxField
                nxPasswordInput
                required
                maxlength="1024"
                placeholder="輸入密碼，回到剛才的畫面"
                [value]="password()"
                [readOnly]="submitting()"
                (input)="password.set($any($event.target).value)"
              />
            </nx-password-field>
            <!-- 鎖定原因與錯誤共用一行：錯誤出現時卡片不跳動，平時也不留空白。 -->
            <p class="lock-note" role="alert" [class.is-error]="error()">
              {{ error() || reasonText() }}
            </p>
          </div>
          <button
            nxLoginSubmit
            type="submit"
            busy="正在解鎖…"
            [phase]="submitPhase()"
            [disabled]="submitting()"
          >
            解鎖
          </button>
        </form>
        <button type="button" class="lock-other" (click)="auth.abandon()">改用其他帳號登入</button>
      </div>
    </div>
  </div>
  @if (pet(); as entrance) {
    <nx-session-lock-pet
      [card]="surface"
      [origin]="entrance.origin"
      [shy]="!!password()"
      [revealed]="field.visible()"
      [capsLock]="field.capsLock()"
      [busy]="submitting()"
      [unlocked]="submitPhase() === 'success'"
      [rejections]="rejections()"
      [owner]="auth.session()?.userId ?? null"
    />
  }
</dialog>
<!--
  倒數島就是鎖定卡的起點：到期時卡片從它當下的尺寸撐開。
  島上的操作不算「使用者回來了」，否則按下「立即鎖定」的瞬間倒數重設、島就先收走了。
-->
<div
  #island
  class="lock-island"
  popover="manual"
  role="group"
  aria-label="工作區即將鎖定"
  [attr.data-on]="islandOn() ? '' : null"
  [attr.data-open]="islandOpen() ? '' : null"
  (pointerdown)="$event.stopPropagation()"
  (keydown)="$event.stopPropagation()"
  (pointerenter)="islandEngaged.set(true)"
  (pointerleave)="islandEngaged.set(false)"
  (focusin)="islandEngaged.set(true)"
  (focusout)="islandEngaged.set(false)"
>
  <svg class="lock-island-ring" viewBox="0 0 36 36" aria-hidden="true">
    <circle cx="18" cy="18" r="16" pathLength="1" />
    <circle
      class="lock-island-value"
      cx="18"
      cy="18"
      r="16"
      pathLength="1"
      [style.stroke-dashoffset]="islandElapsed()"
    />
  </svg>
  <span class="lock-island-text">{{ lock.statusText() }}</span>
  <span class="lock-island-pet" aria-hidden="true">
    <nx-lock-pet-art #islandPet mood="yawn" [look]="islandLook()" />
  </span>
  <span class="lock-island-actions">
    <span class="lock-island-buttons">
      @if (lock.countdown()?.by === 'reauthentication') {
        <button type="button" class="is-primary" (click)="lock.lockNow()">現在驗證</button>
      } @else {
        <button type="button" class="is-primary" (click)="keepUsing()">繼續使用</button>
        <button type="button" (click)="lock.lockNow()">立即鎖定</button>
      }
    </span>
  </span>
</div>
<p class="sr-only" role="status">
  {{ islandOn() ? '工作區即將鎖定，可以繼續使用或立即鎖定。' : '' }}
</p>
