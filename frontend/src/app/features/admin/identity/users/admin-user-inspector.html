<dialog
  nxCompactDialog
  size="lg"
  #dialog
  class="platform-dialog admin-inspector"
  [class.inspector-wide]="store.tab() === 'conversations'"
  [busy]="!!store.saving()"
  (cancel)="cancel($event)"
  (close)="closing()"
>
  @let user = store.current();
  <nx-dialog-header
    icon="user"
    [heading]="user?.displayName ?? ''"
    [detail]="user?.account ?? ''"
    closeLabel="關閉使用者管理"
    [tour]="tour()"
  >
    @if (user) {
      <nx-access-status dialog-title [enabled]="user.enabled !== false" />
    }
    @if (user) {
      <p dialog-subtitle class="dialog-subtitle inspector-subtitle">
        <span class="inspector-roles" [title]="roles()">{{ roles() }}</span>
        <span>{{ methods(user) }}</span>
        <span class="inspector-seen">最近活動 {{ date(user.lastSeenAt) }}</span>
      </p>
    }
    @if (count() > 1) {
      <nx-drawer-pager noun="使用者" [index]="index()" [count]="count()" (move)="step($event)" />
    }
    @if (user) {
      <nx-action-menu label="使用者的其他操作" [items]="menu()" (action)="act($event)" />
    }
  </nx-dialog-header>
  @if (store.overviewError()) {
    <nx-notice class="inspector-notice" tone="danger" [message]="store.overviewError()" />
  }
  @if (reviews().length) {
    <nx-notice class="inspector-notice" tone="warning" icon="tasks">
      <nx-account-review-items [items]="reviews()" (navigate)="close()" />
    </nx-notice>
  }
  <!-- 頁籤固定在面板上方；每個設定頁籤是各自儲存的表單，面板含自己的頁尾。 -->
  <nx-tabs
    #sections
    label="使用者管理分類"
    [items]="tabs()"
    [value]="store.tab()"
    (valueChange)="selectTab($event)"
  />
  @let tab = store.tab();
  <div
    class="inspector-panel"
    role="tabpanel"
    [id]="sections.panelId(tab)"
    [attr.aria-labelledby]="sections.tabId(tab)"
    [nxViewMotion]="tab"
  >
    @if (tab === 'conversations') {
      <nx-admin-user-conversations />
    } @else {
      <nx-admin-user-settings [tab]="tab" />
    }
  </div>
</dialog>
<nx-confirm-dialog />
