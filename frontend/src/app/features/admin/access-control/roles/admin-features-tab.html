<div class="page-toolbar">
  <p class="form-note">
    功能由模組註冊，路由、圖示與 API
    授權固定；這裡調整名稱與啟用。側欄的位置與順序在「選單」頁安排，停用的功能不會出現在任何人的選單。
  </p>
</div>
<nx-data-table
  class="admin-access-table admin-features-table"
  label="功能列表"
  [stacked]="true"
  [busy]="store.refreshing()"
>
  <div table-toolbar class="ui-table-toolbar">
    <h2>
      功能
      @if (store.catalog()) {
        <span class="ui-count-label">{{ features().length }} 項</span>
      }
    </h2>
  </div>
  <table>
    <colgroup>
      <col class="admin-name-column" />
      <col class="admin-status-column" />
      <col />
    </colgroup>
    <thead>
      <tr>
        <th scope="col">功能</th>
        <th scope="col">狀態</th>
        <th scope="col">路由</th>
      </tr>
    </thead>
    <tbody>
      @for (feature of features(); track feature.id) {
        <tr nxTableRow [attr.data-feature]="feature.id" (rowActivate)="edit.emit(feature)">
          <td>
            <div class="feature-name">
              <nx-icon [name]="icon(feature.icon)" />
              <button
                type="button"
                class="ui-table-link admin-table-name"
                data-row-action
                aria-haspopup="dialog"
                [attr.aria-label]="'編輯功能：' + feature.name"
                (click)="edit.emit(feature)"
              >
                <span class="ui-truncate" [title]="feature.name">{{ feature.name }}</span>
              </button>
              <small class="ui-truncate" [title]="feature.id">{{ feature.id }}</small>
            </div>
          </td>
          <td><nx-access-status [enabled]="feature.enabled" /></td>
          <td data-stack="hide">
            @if (feature.route) {
              <span class="ui-truncate ui-table-code feature-route" [title]="feature.route">{{
                feature.route
              }}</span>
            } @else {
              <span class="form-note">無頁面，僅權限</span>
            }
          </td>
        </tr>
      }
    </tbody>
  </table>
  <nx-table-state
    [count]="features().length"
    [loading]="store.loading()"
    loadingText="正在載入功能…"
    emptyTitle="沒有已註冊的功能"
  />
</nx-data-table>
