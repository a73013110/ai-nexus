<nx-feature-page
  [title]="session.featureName('admin')"
  description="管理公司身分、功能授權與 AI 使用政策。"
>
  @if (pageTools().length) {
    <div page-actions class="page-actions">
      <nx-action-menu label="存取管理工具" [items]="pageTools()" (action)="pageAction($event)" />
    </div>
  }
  @if (store.loading()) {
    <p role="status">正在載入管理工作區…</p>
  } @else if (session.me() && !session.has('admin')) {
    <nx-feature-access-notice feature="admin" />
  } @else if (store.error()) {
    <nx-notice [message]="store.error()"
      ><button notice-actions (click)="store.load()">重新載入</button>
    </nx-notice>
  }
  @if (store.catalog()) {
    <nx-view-switch
      label="存取管理分類"
      [options]="tabs"
      [value]="tab()"
      (valueChange)="selectTab($event)"
    />
    @switch (tab()) {
      @case ('users') {
        <nx-admin-users-tab
          [selectedId]="inspected()?.id ?? null"
          (inspect)="inspected.set($event)"
          (edit)="editor.open('user', $event)"
        />
      }
      @case ('roles') {
        <nx-admin-roles-tab (edit)="editor.open('role', $event)" />
      }
      @case ('groups') {
        <nx-admin-groups-tab (edit)="editor.open('group', $event)" />
      }
      @case ('features') {
        <nx-admin-features-tab (edit)="editor.open('feature', $event)" />
      }
    }
  }
</nx-feature-page>
<nx-admin-user-inspector
  [user]="inspected()"
  [models]="store.catalog()?.models || []"
  (closed)="inspected.set(null)"
  (settingsChanged)="store.readUsers()"
/>
<nx-access-editor-dialog #editor />
