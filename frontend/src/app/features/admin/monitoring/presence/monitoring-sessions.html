<div class="ui-filter-grid">
  <nx-search-field
    label="搜尋在線使用者、IP 或裝置"
    placeholder="搜尋使用者、IP 或裝置…"
    [value]="query()"
    (valueChange)="query.set($event)"
  />
  <nx-select
    label="目前功能"
    [options]="featureOptions()"
    [value]="feature()"
    (valueChange)="feature.set($event)"
  />
</div>
<nx-data-table
  label="在線瀏覽器工作階段"
  class="monitor-sessions-table"
  [stacked]="true"
  [busy]="busy()"
  [table]="table"
>
  <table class="monitor-table">
    <thead>
      <tr>
        <th nxHeader="user"></th>
        <th nxHeader="device"></th>
        <th nxHeader="feature"></th>
        <th nxHeader="state"></th>
        <th nxHeader="requests"></th>
        <th nxHeader="lastAction"></th>
      </tr>
    </thead>
    <tbody>
      @for (s of table.rows(); track s.id) {
        <tr nxTableRow [class.is-selected]="selectedId() === s.id" (rowActivate)="selected.emit(s)">
          <td>
            <button
              type="button"
              class="ui-table-link"
              data-row-action
              aria-haspopup="dialog"
              (click)="selected.emit(s)"
            >
              <strong>{{ s.displayName }}</strong
              ><small>{{ s.account }}{{ s.testingIdentity ? ' · 測試身分' : '' }}</small>
            </button>
          </td>
          <td data-label="裝置">
            <span>{{ s.device }} · {{ s.browser }}</span
            ><small class="ui-table-code">{{ s.address }}</small>
          </td>
          <td data-label="功能">{{ featureName(s.feature) }}</td>
          <td data-stack="end">
            <nx-status-badge [tone]="s.state === 'active' ? 'success' : 'neutral'">{{
              stateName(s.state)
            }}</nx-status-badge>
          </td>
          <td class="ui-table-numeric" data-label="請求">
            {{ s.requests }}
            @if (s.errors) {
              <small class="ui-error-text">{{ s.errors }} 錯誤</small>
            }
          </td>
          <td data-stack="hide">
            <span>{{ s.lastAction || '等待操作' }}</span
            ><small>{{ s.lastActionAt ? time(s.lastActionAt) : '—' }}</small>
          </td>
        </tr>
      }
    </tbody>
  </table>
  <nx-table-state
    [emptyTitle]="query() || feature() !== 'all' ? '沒有符合篩選的連線' : '目前沒有在線工作階段'"
  />
</nx-data-table>
