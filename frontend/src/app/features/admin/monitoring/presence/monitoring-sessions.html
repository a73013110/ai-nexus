<div class="ui-filter-grid">
  <nx-search-field
    label="搜尋在線使用者、IP 或裝置"
    placeholder="搜尋使用者、IP 或裝置…"
    [value]="query()"
    (valueChange)="setFilter('query', $event)"
  />
  <nx-select
    label="在線狀態"
    [options]="states"
    [value]="state()"
    (valueChange)="setFilter('state', $event)"
  /><nx-select
    label="目前功能"
    [options]="featureOptions()"
    [value]="feature()"
    (valueChange)="setFilter('feature', $event)"
  />
</div>
<nx-data-table
  label="在線瀏覽器工作階段"
  class="monitor-sessions-table"
  [stacked]="true"
  [busy]="busy()"
>
  <table class="monitor-table">
    <thead>
      <tr>
        <th scope="col" [attr.aria-sort]="sort() === 'name' ? 'ascending' : 'none'">
          <button type="button" class="ui-table-sort" (click)="sort.set('name')">
            使用者 <nx-icon name="chevron" />
          </button>
        </th>
        <th scope="col">裝置／連線位址</th>
        <th scope="col">目前功能</th>
        <th scope="col">狀態</th>
        <th
          scope="col"
          class="ui-table-numeric"
          [attr.aria-sort]="sort() === 'requests' ? 'descending' : 'none'"
        >
          <button type="button" class="ui-table-sort" (click)="sort.set('requests')">
            請求數 <nx-icon name="chevron" />
          </button>
        </th>
        <th scope="col">最近操作</th>
      </tr>
    </thead>
    <tbody>
      @for (s of visible(); track s.id) {
        <tr nxTableRow [class.is-selected]="selectedId() === s.id" (rowActivate)="selected.emit(s)">
          <td>
            <button
              type="button"
              class="ui-table-link"
              data-row-action
              aria-haspopup="dialog"
              (click)="selected.emit(s)"
            >
              <strong>{{ s.displayName }}</strong
              ><small>{{ s.account }}{{ s.testingIdentity ? ' · 測試身分' : '' }}</small>
            </button>
          </td>
          <td data-label="裝置">
            <span>{{ s.device }} · {{ s.browser }}</span
            ><small class="ui-table-code">{{ s.address }}</small>
          </td>
          <td data-label="功能">{{ featureName(s.feature) }}</td>
          <td data-stack="end">
            <nx-status-badge [tone]="s.state === 'active' ? 'success' : 'neutral'">{{
              stateName(s.state)
            }}</nx-status-badge>
          </td>
          <td class="ui-table-numeric" data-label="請求">
            {{ s.requests }}
            @if (s.errors) {
              <small class="ui-error-text">{{ s.errors }} 錯誤</small>
            }
          </td>
          <td data-stack="hide">
            <span>{{ s.lastAction || '等待操作' }}</span
            ><small>{{ s.lastActionAt ? time(s.lastActionAt) : '—' }}</small>
          </td>
        </tr>
      }
    </tbody>
  </table>
  <nx-table-state
    [count]="visible().length"
    [emptyTitle]="
      query() || state() !== 'all' || feature() !== 'all'
        ? '沒有符合篩選的連線'
        : '目前沒有在線工作階段'
    "
  />
  <div table-footer class="ui-table-footer">
    <nx-table-pagination
      mode="offset"
      [pageIndex]="currentPage()"
      [pageSize]="pageSize"
      [pageSizes]="[pageSize]"
      [count]="visible().length"
      [total]="filtered().length"
      (pageChange)="page.set(currentPage() + $event)"
      (pageSelect)="page.set($event)"
    />
  </div>
</nx-data-table>
