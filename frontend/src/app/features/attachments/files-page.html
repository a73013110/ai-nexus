<nx-feature-page
  [title]="session.featureName('files')"
  description="對話附件、知識庫與專案的原檔都保存在這裡，可再用於對話或加入知識庫。"
  [tour]="tour()"
>
  <div page-actions class="page-actions">
    <button
      class="primary-button file-upload"
      [disabled]="uploading() || !policy()"
      (click)="fileInput.click()"
    >
      <nx-icon name="upload" />{{ uploading() ? '正在保存…' : '上傳檔案' }}
    </button>
    <input
      #fileInput
      type="file"
      multiple
      hidden
      [accept]="accept()"
      (change)="chooseFiles(fileInput)"
    />
  </div>
  @if (error()) {
    <nx-notice [message]="error()"
      ><button notice-actions type="button" (click)="reload()">重試</button></nx-notice
    >
  }
  <div
    #gallery
    class="file-drop"
    [nxFileDrop]="!uploading() && !!policy()"
    (filesDropped)="upload($event)"
  >
    <nx-resource-gallery
      label="檔案庫"
      placeholder="搜尋檔案名稱"
      [search]="store.search()"
      [filters]="kinds"
      [filter]="store.type()"
      [loading]="store.loading() && !store.items().length"
      [empty]="!store.items().length"
      (searchChange)="store.find($event)"
      (filterChange)="store.filter($event)"
    >
      <nx-select
        gallery-tools
        class="file-source"
        appearance="pill"
        label="檔案來源"
        [options]="sources"
        [value]="store.source()"
        (valueChange)="store.filter(store.type(), $event)"
      />
      <nx-file-browser
        [items]="store.items()"
        [knowledge]="session.has('knowledge')"
        [busy]="busy()"
        (addKnowledge)="knowledge().open($event)"
        (remove)="remove($event)"
        (rename)="rename($event)"
      />
      <nx-empty-state gallery-empty>
        <nx-icon name="files" />
        @if (store.search() || store.type() !== 'all' || store.source() !== 'all') {
          <h2>沒有符合的檔案</h2>
        } @else {
          <h2>從一份檔案開始</h2>
          <p>上傳或拖曳檔案到這裡，或在對話中傳送附件。</p>
        }
      </nx-empty-state>
    </nx-resource-gallery>
    <span class="file-drop-hint" aria-hidden="true"
      ><nx-icon name="upload" />放開以保存到檔案庫</span
    >
  </div>
  <footer class="file-footer">
    <nx-storage-usage [storage]="store.result.value()?.storage" />
    @if (store.paged()) {
      <nx-table-pagination
        mode="offset"
        [pageIndex]="store.pageIndex()"
        [pageSize]="store.pageSize"
        [pageSizes]="[store.pageSize]"
        [count]="store.items().length"
        [total]="store.total()"
        [busy]="store.loading()"
        (pageChange)="turn(store.pageIndex() + $event)"
        (pageSelect)="turn($event)"
      />
    }
  </footer>
  <nx-add-to-knowledge (added)="added()" /><nx-confirm-dialog /><nx-name-dialog />
</nx-feature-page>
